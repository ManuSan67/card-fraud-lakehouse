resources:
  jobs:
    card_fraud_daily:
      name: card-fraud-daily
      parameters:
        - name: catalog
          default: ${var.catalog}
      email_notifications:
        on_failure:
          - manu.sandoval.c67@gmail.com
        on_duration_warning_threshold_exceeded:
          - manu.sandoval.c67@gmail.com
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 900
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/Mexico_City
        pause_status: PAUSED
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../notebooks/01_generate_data.ipynb
        - task_key: run_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.card_fraud_pipeline.id}
        - task_key: train_model
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../notebooks/02_train_model.ipynb
        - task_key: score_transactions
          depends_on:
            - task_key: train_model
          notebook_task:
            notebook_path: ../notebooks/03_score_transactions.ipynb
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED